<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350">
  <!-- Background Grid (Optional for clarity) -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#eeeeee" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Compass -->
  <g transform="translate(350, 50)">
    <line x1="0" y1="-20" x2="0" y2="20" stroke="black" stroke-width="1.5"/>
    <line x1="-20" y1="0" x2="20" y2="0" stroke="black" stroke-width="1.5"/>
    <text x="0" y="-25" font-family="Arial" font-size="12" text-anchor="middle">N</text>
    <text x="25" y="5" font-family="Arial" font-size="12" text-anchor="middle">E</text>
    <path d="M 0 -20 L -4 -10 L 4 -10 Z" fill="black"/>
  </g>

  <!-- Roads -->
  <g stroke="black" stroke-width="2" fill="none">
    <!-- Horizontal Road -->
    <line x1="60" y1="260" x2="340" y2="260"/>
    <line x1="60" y1="300" x2="340" y2="300"/>
    <!-- Vertical Road -->
    <line x1="300" y1="60" x2="300" y2="300"/>
    <line x1="340" y1="60" x2="340" y2="300"/>
    <!-- Top Road -->
    <line x1="60" y1="60" x2="340" y2="60"/>
    <line x1="60" y1="100" x2="340" y2="100"/>
    <!-- Left Road -->
    <line x1="60" y1="60" x2="60" y2="300"/>
    <line x1="100" y1="60" x2="100" y2="300"/>
  </g>

  <!-- Locations -->
  <!-- Point A: Home -->
  <rect x="40" y="265" width="40" height="30" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="60" y="285" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Home</text>
  <text x="60" y="315" font-family="Arial" font-size="12" text-anchor="middle">(Point A)</text>

  <!-- Point B: (1) -->
  <rect x="310" y="265" width="60" height="30" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="340" y="285" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">(1)</text>

  <!-- Point C: (2) -->
  <rect x="310" y="65" width="60" height="30" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="340" y="85" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">(2)</text>

  <!-- Point D: Park -->
  <rect x="40" y="65" width="60" height="30" fill="#f0f0f0" stroke="black" stroke-width="1.5"/>
  <text x="70" y="85" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Park</text>

  <!-- Distance Labels -->
  <text x="200" y="255" font-family="Arial" font-size="11" text-anchor="middle">400m</text>
  <path d="M 100 250 L 300 250" stroke="black" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  
  <text x="365" y="180" font-family="Arial" font-size="11" text-anchor="middle" transform="rotate(90, 365, 180)">400m</text>

  <!-- Markers for distance lines -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="black" />
    </marker>
  </defs>
  
  <!-- Path Indicators (Dashed) -->
  <path d="M 80 280 L 320 280 L 320 80" fill="none" stroke="black" stroke-width="2" stroke-dasharray="5,5" />
</svg>