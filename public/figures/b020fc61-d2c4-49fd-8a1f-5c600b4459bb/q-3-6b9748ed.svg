<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" width="100%" height="100%">
  <!-- 直角标记 -->
  <path d="M 60 205 L 75 205 L 75 220" fill="none" stroke="#000000" stroke-width="1" />
  
  <!-- 角度 CAD 弧线 -->
  <path d="M 60 80 A 40 40 0 0 0 80 74.6" fill="none" stroke="#000000" stroke-width="1" />
  
  <!-- 三角形 ABC 与线段 AD -->
  <polygon points="60,40 300,220 60,220" fill="none" stroke="#000000" stroke-width="2" stroke-linejoin="round" />
  <line x1="60" y1="40" x2="164" y2="220" stroke="#000000" stroke-width="2" stroke-linejoin="round" />
  
  <!-- 字母与角度标注 -->
  <g font-family="Times New Roman, serif" font-size="18" fill="#000000" text-anchor="middle">
    <!-- 顶点标注 -->
    <text x="60" y="30" font-style="italic">A</text>
    <text x="45" y="238" font-style="italic">C</text>
    <text x="164" y="238" font-style="italic">D</text>
    <text x="312" y="238" font-style="italic">B</text>
    
    <!-- 角度值 -->
    <text x="78" y="105" font-size="14">30°</text>
  </g>
</svg>